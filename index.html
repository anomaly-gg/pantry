<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantry Chef</title>
<meta name="description" content="List what's in your kitchen. Get recipes you can cook right now and a week of meals that uses it all up.">
<meta name="theme-color" content="#0d6b5a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pantry.css">
<link rel="stylesheet" href="css/cook.css">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/week.css">
<link rel="stylesheet" href="css/list.css">
<link rel="stylesheet" href="css/prefs.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 class="brand">Pantry <span>Chef</span></h1>
    <button class="icon-btn" id="prefsBtn" aria-label="Preferences">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.4 2.5h4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4-2.1-1.6zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <section class="view" id="view-pantry" data-tab="pantry"></section>
  <section class="view" id="view-cook" data-tab="cook" hidden></section>
  <section class="view" id="view-week" data-tab="week" hidden></section>
  <section class="view" id="view-list" data-tab="list" hidden></section>
</main>

<nav class="tabbar" aria-label="Sections">
  <button data-tab="pantry" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v4H6zM5 8h14v13H5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 12h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>Pantry</span><b class="badge" id="badge-pantry" hidden></b>
  </button>
  <button data-tab="cook">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18M5 11v6a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-6M9 7c0-2 1-2 1-4M14 7c0-2 1-2 1-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Cook</span>
  </button>
  <button data-tab="week">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>Week</span>
  </button>
  <button data-tab="list">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>List</span><b class="badge" id="badge-list" hidden></b>
  </button>
</nav>

<div id="sheets"></div>

<!-- core: no DOM -->
<script src="js/core/util.js"></script>
<script src="js/core/units.js"></script>
<script src="js/data/ingredients.js"></script>

<script src="js/data/recipes-world.js"></script>
<script src="js/data/examples.js"></script>
<script src="js/core/ingredients.js"></script>

<script src="js/core/store.js"></script>

<script src="js/core/sync.js"></script>
<script src="js/core/prompt.js"></script>
<!-- ui -->
<script src="js/ui/dom.js"></script>
<script src="js/ui/sheets.js"></script>
<script src="js/ui/recipe-card.js"></script>
<script src="js/ui/recipe-sheet.js"></script>

<script src="js/app.js"></script>
</body>
</html>
